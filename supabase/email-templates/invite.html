<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>You're invited to WAdesk</title></head>
<body style="margin:0;padding:0;background:#f1efe9;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1efe9;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:18px;padding:36px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#15140f;">
        <tr><td style="font-size:17px;font-weight:600;letter-spacing:-0.02em;padding-bottom:24px;">WAdesk</td></tr>
        <tr><td style="font-size:24px;line-height:1.25;font-weight:600;letter-spacing:-0.02em;padding-bottom:10px;">You've been invited to a workspace</td></tr>
        <tr><td style="font-size:15px;line-height:1.6;color:#55534a;padding-bottom:26px;">A teammate invited you to join their WhatsApp workspace on WAdesk. Accept the invitation, then choose a password.</td></tr>
        <tr><td style="padding-bottom:28px;">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#15140f;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:13px 26px;border-radius:999px;">Accept invitation</a>
        </td></tr>
        <tr><td style="font-size:13px;line-height:1.6;color:#8a877c;border-top:1px solid #ebe8df;padding-top:20px;">This invitation expires in 14 days. If you weren't expecting it, you can ignore this email.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
